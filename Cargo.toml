[package]
name = "polyhedron-studio"
version = "0.1.0"
edition = "2024"
description = "Polyhedron Studio - voxel game engine and in-engine studio"
license = "MIT OR Apache-2.0"
rust-version = "1.97.1"

[dependencies]
# --- Engine / ECS / renderer ------------------------------------------------
bevy = { version = "=0.20.1", default-features = true }

# --- Editor UI ---------------------------------------------------------------
bevy_egui = "=0.43.1"
egui = "=0.36.2"
egui_dock = { version = "=0.21.1", features = ["serde"] }

# --- Physics -----------------------------------------------------------------
bevy_rapier3d = { version = "=0.37.0", default-features = true }

# --- Window icon (same version as Bevy) -------------------------------------
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

# --- Serialization (open .ron project format) --------------------------------
serde = { version = "=1.0.229", features = ["derive"] }
ron = "=0.12.3"

# --- Procedural world / utility ---------------------------------------------
rand = "=0.9.2"
noise = "=0.9.0"
crossbeam-channel = "=0.5.15"
bytemuck = { version = "=1.25.2", features = ["derive"] }

# --- Procedural audio (DSP, no external assets) ------------------------------
rodio = { version = "=0.23.0", default-features = false, features = ["playback"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
